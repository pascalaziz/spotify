name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: ./scripts/build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Aurorix-unsigned-ipa
          path: build/Aurorix-unsigned.ipa
          if-no-files-found: error
