name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: bash scripts/build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Shell-unsigned-ipa
          path: build/Shell-unsigned.ipa
          if-no-files-found: error

      # Public release asset = downloadable WITHOUT any GitHub login (plain curl)
      - name: Publish release
        run: gh release create "v0.${{ github.run_number }}" build/Shell-unsigned.ipa --title "unsigned build" --notes "automated build" --latest
        env:
          GH_TOKEN: ${{ github.token }}
